[project]
name = "rlm-runtime"
version = "0.1.0"
description = "Kernel-side runtime shim for the omp RLM capability"
requires-python = ">=3.11"
dependencies = [
  "ipykernel",
  "nest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "S",
  "PTH",
  "DTZ",
]
ignore = [
  "S101", # allow assert in test assertions / internal helpers
]
