pivot_guidance:
- 'Independence: no slice depends on another; any order is valid. Infrastructure shared by SLICE-3, SLICE-4 and SLICE-5 (the Raw-I/O Helper) is built by the first of them to ship, only as far as that slice needs; later slices extend it.'
- 'Required Set: SLICE-2 owns loading and proving every Required Set member that exists (REQ-L15586-21, -25); a slice that adds a member (SLICE-1 adds the Search Guard Hook) proves that member by its own behaviour on both hosts.'
- 'Convergence: the first slice that deploys an omp build on a host brings that host to the Shared Commit and satisfies REQ-L15586-01, -02, -03 and -27 for it; every later build re-proves them.'
- 'Proof per slice: each slice ends with its build or hook deployed on both hosts, its REQ-L15586-28 reproduction or REQ-L15586-25 behaviour shown on each host with throwaway databases, the evidence exchanged between Claude and oMACarchy, and Ketema accepting or rejecting the slice.'
- 'Execution: Claude executes only on the Mac and oMACarchy only on the oMACarchy Host (INV-L15586-08, INV-L15586-09).'
- 'SLICE-4 builder: oMACarchy authors contracts, tests and code. Before he has the State Server (decision 3-B, 2026-10-31), each of his phase transitions is approved through Claude and recorded in Claude''s session state with his commit hashes. Claude audits the deliverable independently: clause coverage, theater check, and the throwaway-database reproduction on the Mac.'
- 'Consensus: every artifact Ketema approves also needs oMACarchy''s agreement on the exact SHA-256 of the version approved; any change voids the approval; Ketema is final arbiter.'
- 'Open ambiguities: the Rust-to-helper bridge is settled in SLICE-3 contracts; the herdr and moshi installer pins are settled in the slice that first deploys them.'
