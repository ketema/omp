    decision: "Historical: native provider resolution was proposed as the local-success predicate; clipboard readback was forbidden."
  - id: "5A"
    decision: "Historical: a one-cell pinned selection copied only after a motion-qualified gesture."
  - id: "6A"
    decision: "Ordinary pinned pointer selection is terminal-native; TUI shall not enable pinned mouse reporting, reconstruct pointer-selected bytes, emit OSC 52, call ClipboardTransport, or own wheel scrolling."
    decided_by: "User"
    source: "NATIVE APPROVED"
    supersedes_for_ordinary_pinned_pointer_selection: ["1A", "3A", "4A", "5A"]
  - id: "7A"
    decision: "Fullscreen-overlay mouse reporting is explicit opt-in: only mouseTracking === true owns it. Inherited pinned-frame integrity and inline-mode test debt is deferred without relaxing its contract authority."
    decided_by: "User"
    source: "1 is approved"
  - id: "7B"
    decision: "Defer the pre-existing POST-PV-14 page-navigation keybinding defect to a dedicated slice. Preserve its authoritative contract clause and keep the active Decision 7A GREEN boundary at explicit fullscreen-overlay pointer opt-in."
    decided_by: "User"
    source: "2. defer it"
  - id: "8A"
    decision: "Non-behavioral audit findings are approved for remediation; POST-PV-26 remains the final human-owned confirmation."
    decided_by: "User"
    source: "fix all non behaviorial findings yourself. #5 is the last thing that will be confirmed. that is my responsibility."
  - id: "8B"
    decision: "Behavioral audit findings SHALL follow constitutional-refactor and constitutional-fix; task dispatch SHALL select an explicit model and rebalance with a different provider/model when needed."
    decided_by: "User"
    source: "the lineage problem should be over rideable now. task dispatch should have a specific model parameter. so if you notice an imbalance re-dispatch a different provider/model use constitutional-refactor and constitutional-fix to resolve the behaviorial issues."
  - id: "9A"
    decision: "The prompt input box remains pinned throughout its interactive TUI lifecycle; there is no inline or unpinned viewport mode."
    decided_by: "User"
    source: "there is no unpinned inline mode. ... there is no point or need for the prompt input box to ever not be pinned"

scope_boundary:
  included_domains:
    - "Terminal-native ordinary pinned selection and the dock, alternate-screen, and explicit fullscreen-overlay pointer tracking behavior that must remain intact"
    - "Removal of root-commit `3254d854` pinned mouse-reporting, application selection, OSC 52, clipboard-delivery, and application wheel handling at the smallest seam"
    - "Fullscreen-overlay pointer tracking restricted to the explicit `mouseTracking === true` opt-in"
    - "Focused native-selection regression tests and real Ghostty/Herdr execution verification in DM-4 through DM-9, DM-15 through DM-17"
    - "Pinned-only prompt lifecycle: from TUI start through any exit request, the prompt input box remains in the pinned dock"
  excluded_domains:
    - "New future application-owned wheel features; removal of the existing ordinary pinned SGR wheel branch is included"
    - "Any replacement clipboard provider, clipboard readback, or application-owned pointer-selection fallback"
    - "Inherited pinned-frame render integrity, DECSTBM, and native-scrollback test debt assigned to deferred SLICE-5; generic scrollback and header test debt remains assigned to deferred SLICE-2. Decision-9A lifecycle repair for INV-PV-7 is isolated in SLICE-7; every other deferred clause remains authoritative."
    - "The pre-existing POST-PV-14 keyboard page-navigation binding repair assigned to deferred SLICE-6; its clause remains authoritative"
    - "Unrelated MCP subcommands, generic command output, and deferred SLICE-2 / SLICE-4 behavior"
    - "Core harness source outside the listed package paths"
  enforcement:
    - "Production code does not import either contract file."
    - "No contract clause may be relaxed to satisfy a failing implementation test."
    - "The first round uses an isolated RED test writer followed by an isolated GREEN coder."
    - "Fullscreen overlays retain terminal mouse tracking only after an explicit `mouseTracking === true` request; ordinary pinned mode does not claim pointer selection."
    - "Decision 9A prohibits a configuration, lifecycle path, or compatibility behavior that renders the prompt input box outside the pinned dock."

