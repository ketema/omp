user_decisions:
  - id: "1A"
    decision: "Historical: pinned selection kept OSC 52 compatibility emission and proposed native macOS pasteboard delivery."
  - id: "2A"
    decision: "`/mcp list` is a focused, scrollable, Escape-dismissible overlay with no persistent transcript mount."
  - id: "3A"
    decision: "Historical: pinned clipboard delivery failure used the existing styled `InteractiveMode.showError` transcript surface."
  - id: "4A"
    decision: "Historical: native provider resolution was proposed as the local-success predicate; clipboard readback was forbidden."
  - id: "5A"
    decision: "Historical: a one-cell pinned selection copied only after a motion-qualified gesture."
  - id: "6A"
    decision: "Ordinary pinned pointer selection is terminal-native; TUI shall not enable pinned mouse reporting, reconstruct pointer-selected bytes, emit OSC 52, call ClipboardTransport, or own wheel scrolling."
    decided_by: "User"
    source: "NATIVE APPROVED"
    supersedes_for_ordinary_pinned_pointer_selection: ["1A", "3A", "4A", "5A"]

scope_boundary:
  included_domains:
    - "Terminal-native ordinary pinned selection and the dock, alternate-screen, overlay, and keyboard-navigation behavior that must remain intact"
    - "Removal of root-commit `3254d854` pinned mouse-reporting, application selection, OSC 52, clipboard-delivery, and application wheel handling at the smallest seam"
    - "Focused native-selection regression tests and real Ghostty/Herdr execution verification in DM-4 through DM-9, DM-12, DM-13, DM-15, and DM-16"
  excluded_domains:
    - "New future application-owned wheel features; removal of the existing ordinary pinned SGR wheel branch is included"
    - "Any replacement clipboard provider, clipboard readback, or application-owned pointer-selection fallback"
    - "Unrelated MCP subcommands, generic command output, and deferred SLICE-2 / SLICE-4 behavior"
    - "Core harness source outside the listed package paths"
  enforcement:
    - "Production code does not import either contract file."
    - "No contract clause may be relaxed to satisfy a failing implementation test."
    - "The first round uses an isolated RED test writer followed by an isolated GREEN coder."
    - "Fullscreen overlays retain their independently requested mouse tracking; ordinary pinned mode does not claim pointer selection."

