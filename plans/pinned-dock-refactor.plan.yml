  mcp_inventory_overlay: "requirements/contracts/mcp_list_overlay.contract.ts"

user_decisions:
  - id: "1A"
    decision: "Pinned selection keeps OSC 52 compatibility emission and uses the native macOS pasteboard provider."
  - id: "2A"
    decision: "`/mcp list` is a focused, scrollable, Escape-dismissible overlay with no persistent transcript mount."
  - id: "3A"
    decision: "Pinned clipboard delivery failure uses the existing styled `InteractiveMode.showError` transcript surface."
  - id: "4A"
    decision: "Native provider resolution is the authoritative local-success predicate; OSC 52 is compatibility-only; clipboard readback is forbidden."
  - id: "5A"
    decision: "A one-cell pinned selection copies only after its left-button gesture contains at least one motion event; a no-motion press/release is an intentional no-op."
    decided_by: "User"
    source: "A"

scope_boundary:
  included_domains:
    - "Pinned viewport, selection, and terminal lifecycle regressions recorded in DM-1 through DM-13"
    - "Pinned selection clipboard delivery and styled failure reporting in DM-5 and DM-6"
    - "Motion-qualified one-cell pinned-copy behavior in DM-15"
    - "Focused MCP inventory overlay behavior in DM-14"
  excluded_domains:
    - "Unrelated MCP subcommands and generic command-output behavior"
    - "Clipboard readback, host-selection behavior, and alternate product surfaces"
    - "Core harness source outside the listed package paths"
  enforcement:
    - "Production code does not import either contract file."
    - "No contract clause may be relaxed to satisfy a failing implementation test."
    - "Each first-round feature slice uses an isolated RED test-writer followed by an isolated GREEN coder."

execution_schedule:
  mode: "serial"
  sequence: ["SLICE-1", "SLICE-2", "SLICE-3", "SLICE-4"]
  rationale: "Each slice completes RED, GREEN, and focused audit before the next begins. SLICE-4 is behaviorally independent of clipboard delivery but executes after SLICE-3 because both modify InteractiveMode."

