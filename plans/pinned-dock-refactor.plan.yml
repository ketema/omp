      - "ERRORS-PV-5"
      - "INV-PV-6"
    negative_constraints: ["INV-PV-2", "INV-PV-3", "INV-PV-4", "INV-PV-5", "INV-PV-8", "INV-PV-9", "INV-PV-10", "INV-PV-14", "FORBIDDEN-PV-1", "FORBIDDEN-PV-4"]
    red_gate: "Tests must prove visible overlay compositing, all concatenated SGR reports, pane-local visual selection, OSC 52 compatibility payload emission for a motion-qualified one-cell drag, no OSC 52 payload for a no-motion click, and non-duplicated terminal mode writes through actual input/render paths."
    green_boundary: "Minimal production changes only after failing clause-cited tests exist."
    test_migration:
      - "Rewrite existing pinned-dock POST-PV-6 cases so OSC 52 asserts only the pane-local compatibility payload; neither emitted OSC 52 nor its payload may stand in for native local-copy success."
      - "Keep native provider success and failure assertions exclusively in SLICE-3 under POST-PV-21 through POST-PV-24."
      - "Add a clause-cited paired gesture test: a drag that returns to its start cell emits the pane-local compatibility payload, while a plain press/release on that cell emits no OSC 52."

  - id: "SLICE-2"
    name: "Software scrollback, header retirement, dock clipping, and follow behavior"
    disconnect_rows: ["DM-1", "DM-2", "DM-10", "DM-11"]
    scope:
      - "packages/coding-agent/src/modes/composer.ts"
      - "packages/coding-agent/src/modes/components/transcript-container.ts"
      - "packages/tui/src/pinned-viewport.ts"
      - "packages/coding-agent/test/pinned-dock-refactor.test.ts"
      - "packages/tui/test/pinned-viewport.test.ts"
    clauses_in_scope:
      - "PRE-PV-1"
      - "POST-PV-1"
      - "POST-PV-2"
      - "POST-PV-7"
      - "POST-PV-15"
      - "POST-PV-16"
      - "POST-PV-17"
      - "POST-PV-18"
      - "POST-PV-19"
      - "POST-PV-20"
      - "SEQ-PV-4"
      - "INV-PV-1"
      - "INV-PV-7"
      - "ERRORS-PV-1"
    negative_constraints: ["INV-PV-1", "INV-PV-7"]
    red_gate: "Tests must exercise history beyond the visible window and a real composer-to-viewport frame path; static line-count assertions are forbidden."
    green_boundary: "Preserve the full semantic transcript and avoid reintroducing an inline/unpinned mode."

  - id: "SLICE-3"
    name: "Pinned clipboard native delivery and styled failure feedback"
    depends_on: ["SLICE-1"]
    disconnect_rows: ["DM-5", "DM-6"]
    scope:
      - "packages/tui/src/tui.ts"
      - "packages/coding-agent/src/modes/interactive-mode.ts"
      - "packages/tui/test/pinned-dock-refactor.test.ts"
      - "packages/coding-agent/test/pinned-clipboard-feedback.test.ts"
    new_test_files:
      - "packages/coding-agent/test/pinned-clipboard-feedback.test.ts"
    clauses_in_scope:
      - "PRE-PV-3"
      - "POST-PV-21"
      - "POST-PV-22"
      - "POST-PV-23"
      - "POST-PV-24"
      - "SEQ-PV-7"
      - "SEQ-PV-8"
      - "INV-PV-11"
      - "FORBIDDEN-PV-2"
      - "FORBIDDEN-PV-3"
      - "ERRORS-PV-3"
      - "ERRORS-PV-4"
    negative_constraints: ["INV-PV-11", "FORBIDDEN-PV-2", "FORBIDDEN-PV-3"]
    implementation_direction:
      - "Use the existing `@oh-my-pi/pi-natives/clipboard.copyToClipboard` provider from the TUI package; do not route pinned delivery through the coding-agent utility that intentionally swallows errors."
      - "Represent native resolution or failure at a TUI-local ClipboardTransport boundary; the native result, not OSC 52, determines local success."
      - "Use a standard observer callback from TUI to InteractiveMode for failure presentation so the TUI package does not depend on coding-agent internals."
      - "Attach the callback only after InteractiveMode owns the composer UI; route native failure to `showError`, never to `showPinnedError`."
    test_double_contract:
      - "Any injected native-provider test double must honor the real provider's synchronous `void` success / thrown-value failure boundary documented by `packages/natives/native/clipboard.d.ts`."
      - "The test double must be contract-verified before use; tests must not read the clipboard or infer success from OSC 52 output."
      - "No async mockResolvedValue or Promise-based fake is permitted for the synchronous native provider boundary."
    red_gate: "A native throw despite emitted OSC 52 must fail unless the provider received the ANSI-stripped pane-local payload and InteractiveMode.showError is called exactly once; tests must also fail if showPinnedError or showStatus handles that failure, or if native success produces styled error output."
    green_boundary: "No clipboard readback, no silent native-error absorption, and no production import of the contract."

  - id: "SLICE-4"
    name: "Focused `/mcp list` inventory overlay without transcript persistence"
    # Independent of SLICE-3: `/mcp list` overlay behavior does not require clipboard delivery.
    disconnect_rows: ["DM-14"]
    scope:
      - "packages/coding-agent/src/modes/controllers/mcp-command-controller.ts"
      - "packages/coding-agent/src/modes/interactive-mode.ts"
      - "packages/coding-agent/src/modes/components/session-info-overlay.ts"
      - "packages/coding-agent/test/mcp-list-overlay.test.ts"
      - "packages/coding-agent/test/modes/components/session-info-overlay.test.ts"
    new_test_files:
      - "packages/coding-agent/test/mcp-list-overlay.test.ts"
    clauses_in_scope:
      - "PRE-MCP-1"
      - "POST-MCP-1"
      - "POST-MCP-2"
      - "POST-MCP-3"
      - "POST-MCP-4"
      - "POST-MCP-5"
      - "SEQ-MCP-1"
      - "SEQ-MCP-2"
      - "INV-MCP-1"
      - "INV-MCP-2"
      - "INV-MCP-3"
      - "FORBIDDEN-MCP-1"
      - "ERRORS-MCP-1"
      - "ERRORS-MCP-2"
    negative_constraints: ["INV-MCP-1", "INV-MCP-2", "FORBIDDEN-MCP-1"]
    implementation_direction:
      - "Change only the `/mcp list` branches to call `InteractiveMode.showSessionInfo` after formatting; retain `#showMessage` and `showCommandMessage` for every other MCP command."
      - "Reuse the existing scrollable SessionInfoOverlay and its Escape/cancel close path unless a clause-cited RED test demonstrates a missing behavior."
    red_gate: "Tests must prove both configured-server inventory and no-server guidance avoid transcript mounting, receive focus, scroll, and restore active editor focus after dismissal."
    green_boundary: "Do not create a second overlay implementation or alter generic command-output persistence."

verification_plan:
  contract_gate:
    - "Import each TypeScript contract and execute both success and rejection validators."
    - "Manually audit all five runtime-enforceable artifact classes and verification fields because the authoritative Python checker does not parse TypeScript."
    - "Use a production-source import scan to discharge INV-PV-6 and INV-MCP-3."
  test_gate:
    - "Each RED test includes a clause ID in its assertion failure text and passes the theater question: can production be wrong while this test passes?"
    - "Every fake, stub, or module replacement has a verified behavioral contract before use."
    - "Run focused package tests after each GREEN slice; offload commands exceeding ten seconds or one kilobyte of output to TMUX-OFFLOAD."
    - "For POST-PV-6c and FORBIDDEN-PV-4, exercise actual SGR press/motion/release input rather than private selection-state mutation."
  integration_gate:
    - "Exercise actual TUI drag input/repaint and the real overlay focus/close lifecycle rather than direct private-state mutation."
    - "Before M5, observe a real Ghostty and Herdr pane-confinement selection scenario; tests and metrics do not establish human acceptance."
  audit_gate:
    - "Run the native constitutional audit after GREEN and remediate all clause-cited findings before final validation."

